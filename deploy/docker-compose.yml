name: nodus

# Combined single-origin server unit: Caddy (TLS + routing) in front of the
# Next.js web app and the Go Relay, backed by a local SQLite database and Redis.
# Bring it up with:
#
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build -d
#
# Storage Nodes run on separate machines and connect through the public origin.
#
# The Relay is single-instance: its SQLite file is locked by the process, so do
# not scale the relay service beyond one replica.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis holds more than cache: fetch_token:<token> *is* the credential for
    # the deliberately unauthenticated GET /buffer/fetch, and auth:nonce:<id>
    # carries node and device auth challenges. Every service here shares the
    # default network — the web app included — so an unauthenticated Redis hands
    # those to anything that can reach the port. Require a password.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env (see deploy/.env.example)}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      # SQLite database file. The parent directory must be on a local
      # filesystem (WAL sidecar files are created next to it); do not put it on
      # NFS/SMB.
      DB_PATH: /var/lib/nodus/relay.db
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}@redis:6379/0
      # Browser WS origin(s) allowed to authenticate; must equal the public
      # origin. Defaults to both local spellings so the quickstart works whether
      # it is opened at localhost or 127.0.0.1.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      # false only when the public origin is plain HTTP (local). true in prod.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Caddy is the immediate peer, so the rate limiter may trust X-Forwarded-For.
      TRUST_PROXY: "true"
      BUFFER_DIR: /var/lib/nodus/buffer
      BUFFER_TTL_HOURS: ${BUFFER_TTL_HOURS:-72}
      # Match the client's largest selectable shard size (32 MB); a smaller cap
      # rejects Path C uploads, which then queue on-device instead of buffering.
      MAX_SHARD_BYTES_MB: ${MAX_SHARD_BYTES_MB:-32}
      # Push notifications (optional): an Expo access token for mobile delivery
      # and VAPID keys for browser push. An empty value disables that channel.
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      # One directory holds the SQLite database and its -wal/-shm sidecars plus
      # the shard buffer. Mount the directory, never the .db file on its own:
      # the sidecars must live beside it, and on a local filesystem.
      - relay_data:/var/lib/nodus
    healthcheck:
      # Require both dependencies to be genuinely connected: /health returns a
      # 200 with "status":"ok" only when SQLite answers a real SELECT 1 and
      # Redis pings, whereas a bare status check would mark a partially degraded
      # Relay healthy.
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/health | grep -q '"status":"ok"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      # Inlined into the client bundle at build time (browser push opt-in).
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      # Internal, server-only Relay base used by Next route handlers.
      RELAY_URL: http://relay:8080
      # User-facing origin shown in the "+ Add Storage Node" dialog.
      PUBLIC_RELAY_URL: ${PUBLIC_RELAY_URL:-http://localhost}
      # NEXT_PUBLIC_RELAY_URL is intentionally unset: the browser talks to this
      # origin's /ws (single-origin deploy).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      relay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  redis_data:
  relay_data:
  caddy_data:
  caddy_config:
