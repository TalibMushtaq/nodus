# Local dev fixture for the Relay. The relay's database is a SQLite file
# (DB_PATH, default under the system temp dir), so only Redis is needed here.
services:
  redis:
    image: redis:7-alpine
    container_name: nodus-relay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
