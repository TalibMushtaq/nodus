# Disposable Redis for the Relay's integration tests.
#
# The relay's database is now a per-test SQLite file created under t.TempDir(),
# so no database fixture is needed; only Redis is external (fetch tokens, the
# rate limiter, presence).
#
# Deliberately separate from docker-compose.yml: that file holds the dev stack's
# long-lived Redis data. Port 6380 avoids the dev stack's 6379.
services:
  redis:
    image: redis:7-alpine
    container_name: nodus-relay-test-redis
    restart: "no"
    # requirepass is set so the integration tests exercise the same authenticated
    # path production will use. An unauthenticated Redis silently accepts an
    # AUTH-less client, which would hide a missing-password bug.
    command:
      - redis-server
      - --requirepass
      - ${RELAY_TEST_REDIS_PASSWORD:?set RELAY_TEST_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${RELAY_TEST_REDIS_PASSWORD}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
