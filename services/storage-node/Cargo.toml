[package]
name = "storage-node"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
directories = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
futures-util = "0.3"
tokio-tungstenite = "0.26"
# HTTP client for the Phase 10 buffer-fetch flow (Relay serves shard bytes
# over plain HTTP; no TLS needed for the default local deployment).
reqwest = { version = "0.12", default-features = false }
# URL parsing for deriving the Relay's HTTP fetch endpoint from its WS URL.
url = "2"

[dev-dependencies]
tempfile = "3"

