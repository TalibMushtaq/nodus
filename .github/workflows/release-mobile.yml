name: release-mobile

# Android APKs are versioned independently of the node and web components, so
# only `mobile-v*` tags trigger this workflow. The tag must match the Expo
# `version` in apps/mobile/app.json; the release fails early otherwise.
on:
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    name: release-mobile / android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The upload key must stay stable across releases: Android refuses to
      # install an APK whose signing certificate differs from the installed
      # app. It lives only in repository secrets; the release build never uses
      # the SDK's shared public debug key.
      - name: Write Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.23.0"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Match the SDK/NDK versions the generated Expo project requests. The
      # GitHub runner ships the SDK; use its sdkmanager directly instead of
      # android-actions/setup-android, which currently tries to install a
      # `tools` package that no longer exists in Google's repository.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 2 -name sdkmanager | head -n1)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - run: pnpm install --frozen-lockfile

      # The app imports the workspace packages from their compiled dist output;
      # `mobile...` also builds those dependencies.
      - run: pnpm exec turbo build --filter=mobile...

      - name: Validate tag matches app version
        run: |
          VERSION="$(node -p "require('./apps/mobile/app.json').expo.version")"
          EXPECTED="mobile-v${VERSION}"
          if [ "$EXPECTED" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match app.json ${EXPECTED}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Firebase config is intentionally not committed (its API key trips
      # secret scanning). The repo secret holds the same file EAS receives.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json

      # android/ is generated by Expo CNG and gitignored, so CI regenerates it.
      - name: Generate native Android project
        run: pnpm --filter mobile exec expo prebuild --platform android --clean --no-install

      # CNG always points release builds at the debug key; rewrite it after the
      # native project exists and before Gradle configures the build.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/apply-android-release-signing.mjs

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android

      # Guard against silently falling back to the debug key if the patch or a
      # secret regresses; a mismatched key breaks every future in-place update.
      - name: Verify APK signature
        run: |
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --print-certs \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Package release assets
        run: |
          mkdir -p dist
          ASSET="nodus-mobile-v${VERSION}.apk"
          cp "apps/mobile/android/app/build/outputs/apk/release/app-release.apk" "dist/${ASSET}"
          (cd dist && sha256sum "${ASSET}" > "${ASSET}.sha256")

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nodus Mobile v${{ env.VERSION }}"
          # Draft so the maintainer can add release notes and confirm the APK
          # before users download it.
          draft: true
          # The project currently signs release builds with the generated debug
          # keystore, so this is a sideload-only build, not Play Store ready.
          body: |
            Android APK for Nodus Mobile v${{ env.VERSION }}.

            - Package: `com.talibmushtaq.nodus`
            - Minimum Android: 7.0 (API 24)
            - Signed with the persistent Nodus release key — sideload only, not Play Store ready.
            - Built by [Talib Mushtaq](https://github.com/TalibMushtaq).

            > **Updating from v1.0.0:** that build used Android's shared public
            > debug key, so this release has a different signature. Uninstall the
            > old app once, then install this APK. Future versions install over
            > the top, and the app now shows an update prompt on launch.
            > Uninstalling clears local keys — sign in again and recover with your
            > recovery phrase if needed.

            This release updates the app icon to the amber node-topology mark and
            adds the in-app update check.

            Download the APK, enable "Install unknown apps" for your browser or
            file manager, then open it to install. Verify the SHA-256 checksum
            before installing.
          fail_on_unmatched_files: true
          files: |
            dist/nodus-mobile-v${{ env.VERSION }}.apk
            dist/nodus-mobile-v${{ env.VERSION }}.apk.sha256
