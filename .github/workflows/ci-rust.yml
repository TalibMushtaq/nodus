name: ci-rust

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/storage-node/**"
  push:
    branches: [main]
    paths:
      - "services/storage-node/**"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: rust / lint-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/storage-node

      - run: cargo fmt --check
        working-directory: services/storage-node

      - run: cargo clippy -- -D warnings
        working-directory: services/storage-node

      - run: cargo build
        working-directory: services/storage-node

      - run: cargo test
        working-directory: services/storage-node

  # RustSec advisories for the storage-node dependency tree. Runs on every PR
  # touching the crate: an advisory in an auth/crypto-adjacent crate is worth
  # seeing before it ships, not after. Advisory data only — dependency upgrades
  # are separate, individually reviewed changes.
  #
  # Ignored entries are reviewed exceptions, not "did not look" entries. Re-check
  # each one when the crate that pulls it in is next upgraded.
  audit:
    name: rust / cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2.0.0
        with:
          # The action's `ignore` and `working-directory` inputs; `path` is not
          # one of them and was silently ignored, which ran the scan from the
          # repo root where there is no Cargo.lock.
          working-directory: services/storage-node
          # Raises the advisory-DB fetch rate limit; public repos work without
          # it, but CI runners share an IP.
          token: ${{ secrets.GITHUB_TOKEN }}
          # The `ignore` input is split on commas and nothing else — not on
          # newlines. A `#` "comment" line is therefore data, and an id written
          # with trailing punctuation — "…(RUSTSEC-2024-0370)." — becomes a
          # malformed advisory id that aborts the run before any crate is
          # examined. Keep this a single comma-separated line of bare ids; the
          # reasoning lives here instead.
          #
          # RUSTSEC-2023-0071: Marvin key-recovery timing attack. Transitive via
          # `piper`'s optional rsa feature; the node does no RSA operations, and
          # upstream has no fixed release yet.
          # RUSTSEC-2025-0052, RUSTSEC-2025-0141, RUSTSEC-2020-0016,
          # RUSTSEC-2024-0370: unmaintained, all pulled in by `mdns 3.0.0` /
          # `webrtc-dtls`, neither of which is being replaced for cleanup
          # reasons. Revisit when mDNS or WebRTC is next upgraded.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2025-0052,RUSTSEC-2025-0141,RUSTSEC-2020-0016,RUSTSEC-2024-0370
