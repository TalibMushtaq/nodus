name: ci-ts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: ts / lint-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.23.0"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo lint

      - run: pnpm exec turbo build

      - run: pnpm exec turbo test
