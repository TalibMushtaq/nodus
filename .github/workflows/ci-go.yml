name: ci-go

on:
  pull_request:
    paths:
      - "services/relay/**"
      - "services/api/**"
  push:
    branches: [main]
    paths:
      - "services/relay/**"
      - "services/api/**"

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: go / lint-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - run: go vet ./...
        working-directory: services/relay

      - name: Check gofmt
        run: |
          GOFMT_OUTPUT=$(gofmt -l .)
          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "Files not gofmt'd:"
            echo "$GOFMT_OUTPUT"
            exit 1
          fi
        working-directory: services/relay

      - run: go build ./...
        working-directory: services/relay

      - run: go test ./...
        working-directory: services/relay

  vuln-scan:
    name: go / vuln-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      # Pins the scanner itself so a new govulncheck release cannot turn CI
      # red on its own, separate from a dependency change under review.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # Scans the call graph, not just go.sum: a vulnerable module we never
      # actually call is noise, and a vulnerable module we do call is the
      # signal. A transitive advisory we did not call directly was caught here
      # before, which is the behavior this job exists to keep.
      - name: govulncheck
        run: govulncheck ./...
        working-directory: services/relay

  integration-test:
    name: go / integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      # The database is a per-test SQLite file, but the Redis-dependent tests
      # self-skip without TEST_REDIS_URL, so a plain `go test` in
      # lint-build-test never exercises them. This job brings up a disposable
      # Redis on a non-conflicting port and runs the full suite against it.
      - run: ./scripts/test-integration.sh -count=1
        working-directory: services/relay
